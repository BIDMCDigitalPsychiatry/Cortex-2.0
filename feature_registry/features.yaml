  # --- Phase 5: GPS upgrades (docs/features/gps.md) ---

  home_time_ms:
    display_name: Time at inferred home
    category: mobility
    source_stream: gps
    engine: cortex2
    native: true
    module: gps_home
    unit: milliseconds
    personalized: true
    reliability_metric: supported_duration_ms
    minimum_observability: "6 h supported GPS + observed home record"
    reliability_threshold: null
    reference: Barnett & Onnela 2020; GPS design doc §4

  home_time_fraction:
    display_name: Share of supported time at home
    category: mobility
    source_stream: gps
    engine: cortex2
    native: true
