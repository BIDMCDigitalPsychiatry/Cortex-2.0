features:

  gps_data_quality:
    display_name: GPS data quality
    category: observability
    source_stream: gps
    engine: cortex2
    unit: proportion
    native: false
    personalized: false

  accelerometer_data_quality:
    display_name: Accelerometer data quality
    category: observability
    source_stream: accelerometer
    engine: cortex2
    unit: proportion
    native: false
    personalized: false

  screen_observed:
    display_name: Screen stream availability
    category: observability
    source_stream: screen
    engine: cortex2
    unit: binary
    native: false
    personalized: false

  screen_duration:
    display_name: Screen duration
    category: behavior
    source_stream: screen
    engine: cortex
    dependency: screen_active
    unit: hours_per_day
    personalized: true
    reliability_metric: screen_observed
    reliability_threshold: null

  hometime:
    display_name: Home time
    category: mobility
    source_stream: gps
    engine: cortex
    dependency: significant_locations
    unit: hours_per_day
    personalized: true
    reliability_metric: gps_data_quality
    reliability_threshold: null

  location_entropy:
    display_name: Location entropy
    category: mobility
    source_stream: gps
    engine: cortex
    dependency: significant_locations
    unit: entropy
    personalized: true
    reliability_metric: gps_data_quality
    reliability_threshold: null

  trip_distance:
    display_name: Trip distance
    category: mobility
    source_stream: gps
    engine: cortex
    dependency: trips
    unit: kilometers_per_day
    personalized: true
    reliability_metric: gps_data_quality
    reliability_threshold: null

  trip_duration:
    display_name: Trip duration
    category: mobility
    source_stream: gps
    engine: cortex
    dependency: trips
    unit: hours_per_day
    personalized: true
    reliability_metric: gps_data_quality
    reliability_threshold: null

  trip_count:
    display_name: Trip count
    category: mobility
    source_stream: gps
    engine: cortex2
    dependency: cortex.trips
    unit: count_per_day
    personalized: true
    reliability_metric: gps_data_quality
    reliability_threshold: null

  significant_location_count:
    display_name: Significant location count
    category: mobility
    source_stream: gps
    engine: cortex2
    dependency: cortex.significant_locations
    unit: count_per_day
    personalized: true
    reliability_metric: gps_data_quality
    reliability_threshold: null

  # --- Phase 3: accelerometer (docs/features/accelerometer.md) ---

  mean_enmo_mg:
    display_name: Mean ENMO (worn time)
    category: activity
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_daily
    unit: mg
    personalized: true
    reliability_metric: acc_valid_minutes
    minimum_observability: "600 valid minutes"
    reliability_threshold: null
    reference: van Hees 2013

  acc_nonwear_fraction:
    display_name: Phone not-carried fraction
    category: observability
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_nonwear
    unit: fraction
    personalized: true
    reliability_metric: acc_evaluable_ms
    minimum_observability: "3600000 ms judged"
    reliability_threshold: null
    reference: van Hees 2011

  active_minutes:
    display_name: Active minutes
    category: activity
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_fragmentation
    unit: minutes_per_day
    personalized: true
    reliability_metric: acc_valid_minutes
    minimum_observability: "600 valid minutes"
    reliability_threshold: null
    reference: Di 2017

  sedentary_minutes:
    display_name: Sedentary minutes
    category: activity
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_fragmentation
    unit: minutes_per_day
    personalized: true
    reliability_metric: acc_valid_minutes
    minimum_observability: "600 valid minutes"
    reliability_threshold: null
    reference: Di 2017

  astp_per_min:
    display_name: Active-to-sedentary transition probability
    category: activity
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_fragmentation
    unit: per_minute
    personalized: true
    reliability_metric: acc_valid_minutes
    minimum_observability: "600 valid minutes"
    reliability_threshold: null
    reference: Di 2017

  satp_per_min:
    display_name: Sedentary-to-active transition probability
    category: activity
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_fragmentation
    unit: per_minute
    personalized: true
    reliability_metric: acc_valid_minutes
    minimum_observability: "600 valid minutes"
    reliability_threshold: null
    reference: Di 2017

  mean_active_bout_min:
    display_name: Mean active bout length
    category: activity
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_fragmentation
    unit: minutes
    personalized: true
    reliability_metric: acc_valid_minutes
    minimum_observability: "600 valid minutes"
    reliability_threshold: null
    reference: Di 2017

  active_bout_gini:
    display_name: Active bout Gini
    category: activity
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_fragmentation
    unit: index
    personalized: true
    reliability_metric: acc_valid_minutes
    minimum_observability: "600 valid minutes; >= 2 bouts"
    reliability_threshold: null
    reference: Di 2017

  interdaily_stability:
    display_name: Interdaily stability
    category: circadian
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_circadian
    unit: index
    personalized: true
    reliability_metric: n_days_valid
    minimum_observability: "5 valid days of >= 18 observed hours; <= 20% cells excluded"
    reliability_threshold: null
    reference: Van Someren 1999

  intradaily_variability:
    display_name: Intradaily variability
    category: circadian
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_circadian
    unit: index
    personalized: true
    reliability_metric: n_days_valid
    minimum_observability: "5 valid days of >= 18 observed hours; <= 20% cells excluded"
    reliability_threshold: null
    reference: Van Someren 1999

  relative_amplitude:
    display_name: Relative amplitude
    category: circadian
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_circadian
    unit: index
    personalized: true
    reliability_metric: n_days_valid
    minimum_observability: "5 valid days of >= 18 observed hours; <= 20% cells excluded"
    reliability_threshold: null
    reference: Van Someren 1999

  m10_mg:
