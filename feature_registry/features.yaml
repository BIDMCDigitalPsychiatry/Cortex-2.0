    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_circadian
    unit: mg
    personalized: true
    reliability_metric: n_days_valid
    minimum_observability: "5 valid days"
    reliability_threshold: null
    reference: Van Someren 1999

  l5_mg:
    display_name: Least active 5 h (L5)
    category: circadian
    source_stream: accelerometer
    engine: cortex2
    native: true
    module: acc_circadian
    unit: mg
    personalized: true
    reliability_metric: n_days_valid
    minimum_observability: "5 valid days"
    reliability_threshold: null
    reference: Van Someren 1999

  m10_onset_local_h:
