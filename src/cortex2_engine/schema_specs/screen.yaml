name: screen
version: '1.0'
required:
  study_id: string
  timestamp_ms: int64
  timestamp_utc: datetime_utc
  event: string
  source_platform: string
  source_stream: string
  source_participant_id: string
optional:
  device_id: string
  value: float64
  representation_original: string
  battery_level_fraction: float64
  source_file: string
  source_record_id: string
  source_participant_id: string
  participant_id: string
  episode_id: string
allowed_events:
- screen_on
- screen_off
- unlock
- lock
- unknown

constraints:
  battery_level_fraction:
    min: 0
    max: 1
