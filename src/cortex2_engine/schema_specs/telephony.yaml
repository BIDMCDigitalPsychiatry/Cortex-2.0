name: telephony
version: '1.0'

description: >
  Call and SMS metadata. Content is never represented. Counterpart identity is a
  study-scoped pseudonymous hash (blake2b, see MindLAMPAdapter._pseudonymous_hash);
  raw phone numbers and device traces are not propagated.

required:
  study_id: string
  timestamp_ms: int64
  timestamp_utc: datetime_utc
  channel: string
  direction: string
  source_platform: string
  source_stream: string
  source_participant_id: string

optional:
  participant_id: string
  episode_id: string
  device_id: string
  source_file: string
  source_record_id: string
  duration_ms: float64
  contact_hash: string

allowed_values:
  channel:
  - call
  - sms
  - unknown
  direction:
  - incoming
  - outgoing
  - missed
  - unknown

constraints:
  duration_ms:
    min: 0
